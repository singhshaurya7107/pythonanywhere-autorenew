name: Renew PythonAnywhere Web App

on:
  schedule:
    - cron: '0 0 1,25 * *'  # Runs automatically on the 1st and 25th of every month
  workflow_dispatch:     # Adds a manual test button

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Requirements
        run: pip install requests beautifulsoup4
        
      - name: Run Renewal Script
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
        run: python renew.py
